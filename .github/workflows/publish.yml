name: Publish
permissions:
  id-token: write
  contents: read
on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:packages
      - run: node scripts/prepare-package.mjs "$PACKAGE"
      - run: npm publish --access public "./packages/$PACKAGE/build"
