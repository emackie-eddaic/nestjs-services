version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    assignees:
      - 'emackie-eddaic'
    commit-message:
      prefix: 'fix'
      include: 'scope'

  # All npm workspaces share the root lockfile.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    assignees:
      - 'emackie-eddaic'
    commit-message:
      prefix: 'fix'
      prefix-development: 'chore'
      include: 'scope'
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      jest:
        patterns:
          - '@types/jest'
          - 'jest'
          - 'ts-jest'
      nestjs:
        patterns:
          - '@nestjs/*'
      prettier:
        patterns:
          - 'eslint-config-prettier'
          - 'eslint-plugin-prettier'
          - 'prettier'
      eslint:
        patterns:
          - '@eslint/*'
          - 'eslint'
          - 'eslint-*'
          - 'typescript-eslint'
